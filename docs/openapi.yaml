openapi: 3.1.0
info:
  version: 1.0.0
  title: Contacts web servise
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
tags:
  - name: Contacts
    description: Operations with contacts.
  - name: Auth
    description: Auth operations.
servers:
  - url: http://localhost:3000
  - url: https://nodejs-hw-mongodb-1-fa7k.onrender.com
paths:
  /contacts:
    get:
      $ref: '../swagger/paths/contacts/get.yaml'
    post:
      $ref: '../swagger/paths/contacts/post.yaml'
  /contacts/{id}:
    get:
      $ref: '../swagger/paths/contacts/{id}/get.yaml'
    patch: 
      $ref: '../swagger/paths/contacts/{id}/patch.yaml'
    delete: 
       $ref: '../swagger/paths/contacts/{id}/delete.yaml'
  /auth/register:
    post:
      $ref: '../swagger/paths/auth/post/register.yaml'
  /auth/login:
    post: 
      $ref: '../swagger/paths/auth/post/login.yaml'
  /auth/get-oauth-url:
    get:
     $ref: '../swagger/paths/auth/get/get-oauth-url.yaml'
  /auth/confirm-oauth:
    post:
      $ref: '../swagger/paths/auth/post/confirm-oauth.yaml'
  /auth/refresh:
    post: 
      $ref: '../swagger/paths/auth/post/refresh.yaml'
  /auth/lsend-reset-email:
    post: 
      $ref: '../swagger/paths/auth/post/send-reset-email.yaml'
  /auth/reset-pwd:
    post: 
      $ref: '../swagger/paths/auth/post/reset-pwd.yaml'
  /auth/logout:
    post:
      $ref: '../swagger/paths/auth/post/logout.yaml'
    

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer